    .link:hover, .link:focus-visible { transform: translateY(-4px) scale(1.01); background: rgba(37,37,46,.95); border-color: rgba(255,255,255,.34); outline: none; }
    .icon { flex: 0 0 47px; height: 47px; border-radius: 13px; display: grid; place-items: center; margin-left: 15px; direction: ltr; }
    .icon svg { width: 25px; height: 25px; fill: currentColor; }
    .name { flex: 1; text-align: right; font-size: 20px; font-weight: 700; }
    .arrow { color: #b9b9c3; font-size: 25px; line-height: 1; transform: rotate(180deg); }
